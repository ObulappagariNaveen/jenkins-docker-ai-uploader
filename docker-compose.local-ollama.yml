services:
  web:
    image: jenkins-docker-ai-uploader-web:latest
    build: .
    container_name: jenkins-ai-web-local-ollama
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: jenkins-failure-explainer
      OLLAMA_TIMEOUT_SECONDS: "300"
      DATA_DIR: /data
    ports:
      - "8081:8080"
    volumes:
      - ./app.py:/app/app.py:ro
      - ./watch_jenkins_failures.py:/app/watch_jenkins_failures.py:ro
      - ./reference_formats:/app/reference_formats:ro
      - jenkins-ai-data-local-ollama:/data

volumes:
  jenkins-ai-data-local-ollama:
